<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>식사비 계산기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
      font-size: 18px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 18px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin: 0 0 24px;
      text-align: center;
      font-size: 28px;
      color: #1f3a5f;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 18px;
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    input {
      width: 100%;
      min-width: 0;
      height: 48px;
      padding: 10px 12px;
      border: 2px solid #cfd8e3;
      border-radius: 10px;
      font-size: 18px;
    }

    input:focus {
      outline: none;
      border-color: #2f80ed;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
    }

    .unit {
      flex: 0 0 auto;
      font-size: 18px;
      font-weight: 700;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 6px;
      border: none;
      border-radius: 10px;
      background: #2f80ed;
      color: white;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      background: #1f6fd1;
    }

    .result {
      margin-top: 22px;
      padding: 16px;
      border-radius: 12px;
      background: #eef6ff;
      border: 1px solid #bfdbfe;
      font-size: 20px;
      font-weight: 700;
    }

    .result p {
      margin: 6px 0;
    }

    .result .sub {
      font-size: 17px;
      font-weight: 500;
      color: #33475b;
    }

    .message {
      margin-top: 16px;
      color: #d32f2f;
      font-weight: 700;
      font-size: 18px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 360px) {
      body {
        padding: 16px 10px;
      }

      .container {
        padding: 20px 14px;
      }

      h1 {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>식사비 계산기</h1>

    <form id="mealForm" novalidate>
      <div class="field">
        <label for="totalCost">전체 식사비</label>
        <div class="input-wrap">
          <input
            id="totalCost"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="예: 30000"
          />
          <span class="unit">원</span>
        </div>
      </div>

      <div class="field">
        <label for="peopleCount">인원수</label>
        <div class="input-wrap">
          <input
            id="peopleCount"
            type="text"
            inputmode="numeric"
            autocomplete="off"
            placeholder="예: 3"
          />
          <span class="unit">명</span>
        </div>
      </div>

      <button type="submit">계산하기</button>
    </form>

    <section id="result" class="result hidden" aria-live="polite">
      <p id="perPerson"></p>
      <p id="remainder" class="sub"></p>
    </section>

    <p id="message" class="message" aria-live="polite"></p>
  </main>

  <script>
    const form = document.getElementById("mealForm");
    const totalCostInput = document.getElementById("totalCost");
    const peopleCountInput = document.getElementById("peopleCount");

    const resultBox = document.getElementById("result");
    const perPersonText = document.getElementById("perPerson");
    const remainderText = document.getElementById("remainder");
    const messageText = document.getElementById("message");

    function hideResult() {
      resultBox.classList.add("hidden");
      perPersonText.textContent = "";
      remainderText.textContent = "";
    }

    function showMessage(message) {
      messageText.textContent = message;
    }

    function clearMessage() {
      messageText.textContent = "";
    }

    function normalizeNumberText(value) {
      return value.trim().replaceAll(",", "");
    }

    function isIntegerText(value) {
      return /^\d+$/.test(value);
    }

    function formatWon(value) {
      return value.toLocaleString("ko-KR");
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const totalCostRaw = totalCostInput.value.trim();
      const peopleCountRaw = peopleCountInput.value.trim();

      hideResult();
      clearMessage();

      // 빈 값 처리: 어느 칸이 비었는지에 따라 메시지와 커서 위치를 다르게 합니다.
      if (totalCostRaw === "" || peopleCountRaw === "") {
        if (totalCostRaw === "" && peopleCountRaw === "") {
          showMessage("식사비와 인원수를 입력해 주세요");
          totalCostInput.focus();
        } else if (totalCostRaw === "") {
          showMessage("식사비를 입력해 주세요");
          totalCostInput.focus();
        } else {
          showMessage("인원수를 입력해 주세요");
          peopleCountInput.focus();
        }
        return;
      }

      const totalCostText = normalizeNumberText(totalCostRaw);
      const peopleCountText = normalizeNumberText(peopleCountRaw);

      if (!isIntegerText(totalCostText)) {
        showMessage("식사비는 0원 이상의 정수로 입력해 주세요");
        totalCostInput.focus(); // 식사비 칸으로 커서 이동
        return;
      }

      if (!isIntegerText(peopleCountText)) {
        showMessage("인원수는 1명 이상 입력해 주세요");
        peopleCountInput.focus(); // 인원수 칸으로 커서 이동
        return;
      }

      const totalCost = Number(totalCostText);
      const peopleCount = Number(peopleCountText);

      if (peopleCount < 1) {
        showMessage("인원수는 1명 이상 입력해 주세요");
        peopleCountInput.focus(); // 인원수 칸으로 커서 이동
        return;
      }

      const perPerson = Math.floor(totalCost / peopleCount);
      const remainder = totalCost - perPerson * peopleCount;

      perPersonText.textContent = "한 사람당 " + formatWon(perPerson) + "원";

      // 남는 금액에 따라 안내 문구를 다르게 보여줍니다.
      // 남는 금액이 있으면 그 금액만큼의 인원이 1원씩 더 내면 총액이 맞습니다.
      if (remainder === 0) {
        remainderText.textContent = "남는 금액 없이 정확히 나누어떨어집니다.";
      } else {
        remainderText.textContent =
          "남는 금액 " + formatWon(remainder) + "원 " +
          "(" + remainder + "명은 " + formatWon(perPerson + 1) + "원씩 내면 딱 맞습니다)";
      }

      resultBox.classList.remove("hidden");
    });

    // 입력값이 바뀌면 이전 결과와 메시지를 지웁니다.
    // 사용자가 값을 바꾼 뒤 이전 결과를 현재 결과로 오해하지 않도록 하기 위함입니다.
    function resetOutput() {
      hideResult();
      clearMessage();
    }

    totalCostInput.addEventListener("input", resetOutput);
    peopleCountInput.addEventListener("input", resetOutput);
  </script>
</body>
</html>
